    <style type="text/tailwindcss">
@tailwind base;
@tailwind components;
@tailwind utilities;

/**
 * Apple-Inspired Design System CSS Variables (Light & Dark Themes)
 * Single accent colour (#0071e3 light / #2997ff dark) + calm neutral surfaces.
 */
:root {
  --bg: #f5f5f7;
  --card: #ffffff;
  --surface-subtle: #ebebef;
  --nav-bg: rgba(245, 245, 247, 0.78);
  --text: #1d1d1f;
  --muted: #6e6e73;
  --border: rgba(29, 29, 31, 0.09);
  --accent: #0071e3;
  --accent-hover: #0077ed;
  --accent-soft: rgba(0, 113, 227, 0.1);
  --status-green: #30d158;
  --status-amber: #ff9f0a;
  --status-red: #ff453a;
}

.dark {
  --bg: #000000;
  --card: #1c1c1e;
  --surface-subtle: #2c2c2e;
  --nav-bg: rgba(0, 0, 0, 0.72);
  --text: #f5f5f7;
  --muted: #a1a1a6;
  --border: rgba(255, 255, 255, 0.11);
  --accent: #2997ff;
  --accent-hover: #47a6ff;
  --accent-soft: rgba(41, 151, 255, 0.14);
  --status-green: #30d158;
  --status-amber: #ff9f0a;
  --status-red: #ff453a;
}

@layer base {
  html {
    background-color: var(--bg);
    color: var(--text);
    font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    background-color: var(--bg);
    color: var(--text);
  }

  /* Lenis smooth scroll base */
  html.lenis,
  html.lenis body {
    height: auto;
  }

  .lenis.lenis-smooth {
    scroll-behavior: auto !important;
  }

  .lenis.lenis-stopped {
    overflow: hidden;
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
}

@layer components {
  /* Calm Apple-style surface card */
  .glass-card {
    background-color: var(--card);
    border: 1px solid var(--border);
    @apply rounded-3xl transition-shadow duration-300 shadow-apple dark:shadow-apple-dark;
  }

  /* Sticky Frosted-Glass Apple Navbar */
  .apple-frosted-nav {
    background-color: var(--nav-bg);
    border-bottom: 1px solid var(--border);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
  }

  /* Huge Apple Hero Display Headline (40px -> 80px) */
  .hero-headline {
    font-size: clamp(2.5rem, 6vw, 5rem);
    letter-spacing: -0.03em;
    line-height: 1.04;
    font-weight: 700;
  }

  /* Gradient reserved sparingly for hero headline only */
  .hero-headline-gradient {
    background: linear-gradient(180deg, var(--text) 0%, var(--accent) 135%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .input-field {
    background-color: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    @apply w-full rounded-xl px-3.5 py-2.5 text-sm outline-none transition
      placeholder:text-[var(--muted)]
      focus:border-[var(--accent)] focus:ring-2 focus:ring-[var(--accent-soft)];
  }

  /* Solid Single-Accent Apple Pill/Rounded Button with Press Shrink */
  .btn-primary {
    background-color: var(--accent);
    @apply inline-flex items-center justify-center gap-2 rounded-full px-5 py-2.5 text-sm font-medium text-white
      transition-all duration-200 hover:brightness-110 active:scale-[0.97]
      focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--accent)] focus-visible:ring-offset-2
      dark:focus-visible:ring-offset-black disabled:opacity-45 disabled:pointer-events-none;
  }

  .btn-secondary {
    background-color: var(--surface-subtle);
    color: var(--text);
    border: 1px solid var(--border);
    @apply inline-flex items-center justify-center gap-2 rounded-full px-5 py-2.5 text-sm font-medium
      transition-all duration-200 hover:brightness-95 dark:hover:brightness-110 active:scale-[0.97]
      focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--accent)];
  }
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.recharts-tooltip-wrapper {
  transition: transform 180ms cubic-bezier(0.22, 1, 0.36, 1), opacity 150ms ease !important;
}
